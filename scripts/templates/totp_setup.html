{% extends "base.html" %}
{% block title %}TOTP Setup — moomoo-trader{% endblock %}

{% block body %}
<div class="login-wrap">
  <div class="login-card" style="max-width:340px">
    <div class="login-title">AUTHENTICATOR SETUP</div>
    <p class="muted" style="font-size:12px;margin-bottom:16px;text-align:center">
      Scan with Google Authenticator, Authy, or any TOTP app.
    </p>
    <div style="text-align:center;margin-bottom:16px">
      <img src="data:image/png;base64,{{ qr_b64 }}" alt="TOTP QR Code"
           style="width:220px;height:220px;border-radius:6px">
    </div>
    <div style="font-size:11px;color:var(--muted);text-align:center;margin-bottom:20px">
      Manual entry: <code style="font-family:monospace;letter-spacing:2px;color:var(--fg)">{{ secret }}</code>
    </div>
    <a href="/config" class="btn primary" style="display:block;text-align:center;text-decoration:none">
      Done — go to config
    </a>
  </div>
</div>
{% endblock %}
